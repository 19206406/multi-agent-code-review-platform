services:
  redis:
    image: redis:7-alpine
    networks:
      - microservices-network

  kafka:
    image: confluentinc/cp-kafka:8.2.2
    networks:
      - microservices-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge